[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "codameter"
description = "Operational six-phase workflow for interpreting seismic velocity changes (dv/v) as stress and strain meters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Marine A. Denolle", email = "mdenolle@uw.edu" },
]
keywords = [
    "seismology",
    "ambient noise",
    "dvv",
    "poroelasticity",
    "thermoelasticity",
    "groundwater",
    "stress monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "xarray>=2023.6",
]
dynamic = ["version"]

[project.optional-dependencies]
kernels = ["disba>=0.7,<0.8"]
mcmc = ["emcee>=3.1"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.80",
]
dev = [
    "codameter[kernels,mcmc,docs,test]",
    "black>=23.10",
    "ruff>=0.1",
    "mypy>=1.6",
    "pre-commit>=3.5",
]
aws = ["boto3>=1.28"]  # s3:// output for codameter-bench (Fargate/Batch)
all = ["codameter[kernels,mcmc]"]

[project.scripts]
codameter = "codameter.cli:main"
codameter-bench = "codameter.bench:main"

[project.urls]
Homepage = "https://github.com/Denolle-Lab/codameter"
Documentation = "https://denolle-lab.github.io/codameter"
Issues = "https://github.com/Denolle-Lab/codameter/issues"
Source = "https://github.com/Denolle-Lab/codameter"

[tool.hatch.version]
path = "src/codameter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codameter"]

# ---------- tooling ----------

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "NPY", # NumPy-specific rules
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"__init__.py" = ["F401"]  # unused-import OK in __init__

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
ignore_missing_imports = true
disallow_untyped_defs = false  # gradually typed
check_untyped_defs = true

# Pre-existing debt, itemized per file/error-code (never a blanket ignore), so the
# global strict settings above still apply everywhere else and to any *new* error
# code in these same files. The pre-commit mypy hook was never actually wired up
# to run locally until 2026-07 (the git hook wasn't installed), so this is the
# backlog that had accumulated unseen; it is not a deliberate design choice.
# Shrink this list as each file is brought back under warn_return_any etc.
[[tool.mypy.overrides]]
module = [
    "codameter.forward.damage",
    "codameter.forward.poroelastic",
    "codameter.forward.thermoelastic",
    "codameter.coupling.tier1_poroelastic",
    "codameter.coupling.tier3_saturation",
    "codameter.coupling.tier4_thermo_capillary",
    "codameter.inverse.posterior",
    "codameter.kernels.velocity_models",
    "codameter.uq_depth",
    "codameter.uq_measurement",
    "codameter.workflow",
    "codameter.anomaly.detection",
]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
    "codameter.coupling.tier2_damage",
    "codameter.coupling.decision_tree",
    "codameter.inverse.linear_fit",
]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "codameter.data.loaders"
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = "codameter.data.readiness"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "codameter.anomaly.attribution"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "codameter.deviations"
disable_error_code = ["attr-defined", "operator", "var-annotated"]

[[tool.mypy.overrides]]
module = "codameter.synthetic_demo"
disable_error_code = ["assignment", "attr-defined", "no-any-return", "operator"]

[[tool.mypy.overrides]]
module = "codameter.uq_bayes"
disable_error_code = ["arg-type", "assignment"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "needs_disba: requires the optional disba dependency",
    "needs_emcee: requires the optional emcee dependency",
]

[tool.coverage.run]
branch = true
source = ["src/codameter"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
