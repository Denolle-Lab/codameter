name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: ruff
        run: ruff check src/ tests/
      - name: black --check
        run: black --check src/ tests/

  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: pytest
        run: pytest -ra --cov=src/dvv_workflow --cov-report=xml --cov-report=term
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-with-disba:
    name: pytest with disba (optional kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install with kernel extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,kernels]"
      - name: pytest (only the disba-marked tests)
        run: pytest -ra -m needs_disba

  examples:
    name: examples run end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: synthetic Parkfield example
        run: python examples/01_parkfield_synthetic.py --output runs/pk --no-plot
      - name: Clements & Denolle 2023 (synthetic mode)
        run: |
          python examples/02_clements_denolle_2023.py \
            --output runs/cd2023 --no-plot
      - name: artefact bundle
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs
          path: runs/
          retention-days: 7
